name: qmax_tools
description: QMAX Tools — Hardware, construction materials and tools e-commerce for Hargeisa, Somaliland.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  go_router: ^15.1.2
  cached_network_image: ^3.4.1
  intl: any
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  collection: ^1.19.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
